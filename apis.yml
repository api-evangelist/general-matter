aid: general-matter
name: General Matter
description: 'General Matter is a domestic nuclear-fuel company founded in 2024 and based in California,
  building United States uranium enrichment capacity to produce low-enriched uranium (LEU) and high-assay
  low-enriched uranium (HALEU) for advanced commercial and government nuclear reactors. Co-founded by
  Scott Nolan and Lee Robinson and backed by Founders Fund, the company was awarded a $900M Department
  of Energy IDIQ contract and plans a $1.5B commercial enrichment facility at the former Paducah Gaseous
  Diffusion Plant in Kentucky, plus a lease on the Hanford Fuels and Materials Examination Facility in
  Washington. Its mission is to reduce American reliance on foreign nuclear fuel and strengthen energy
  independence. General Matter is an industrial energy manufacturer with no public developer API; this
  profile captures its identity, website properties, and domain-security posture.'
